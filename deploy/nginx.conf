map $http_x_forwarded_proto $koodo_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 512m;

    location = /.env {
        return 404;
    }

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location /v1/ {
        proxy_pass http://koodo-reader-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $koodo_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location ~ ^/(users|syncs)/ {
        proxy_pass http://koodo-reader-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $koodo_forwarded_proto;
    }

    location = /healthcheck {
        proxy_pass http://koodo-reader-service:8081;
        proxy_set_header Host $host;
    }

    location ~ ^/(upload|download|delete|list)$ {
        proxy_pass http://koodo-reader-service:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $koodo_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
