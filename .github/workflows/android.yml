name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --network-timeout 1000000

      - name: Run React tests
        env:
          CI: true
        run: yarn test --watchAll=false --runInBand

      - name: Build web app and sync Android project
        run: yarn android:sync

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Koodo-Reader-android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koodo-reader-android-debug
          path: Koodo-Reader-android-debug.apk
          if-no-files-found: error
          retention-days: 14
