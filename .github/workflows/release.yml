name: Build/release

on: workflow_dispatch

jobs:
  release:
    runs-on: ${{ matrix.os }}

    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}

    # Platforms to build on/for
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-22.04, windows-2022, ubuntu-24.04-arm]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Snapcraft
        uses: samuelmeuli/action-snapcraft@v3
        # Only install Snapcraft on Ubuntu
        if: startsWith(matrix.os, 'ubuntu-22.04')
      - name: Install Gcc
        if: startsWith(matrix.os, 'ubuntu-22.04')
        run: |
          sudo apt update
          sudo apt-get install gcc-multilib g++-multilib
      - name: Install FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          sudo apt update
          sudo apt-get install -y ruby-full build-essential zlib1g-dev liblzma-dev
          sudo gem install --no-document fpm
      - name: Prepare for app notarization (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
        # Import Apple API key for app notarization on macOS
        shell: bash
        run: |
          if [[ -z "$MAC_CERTS" ]]; then
            node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); delete p.build.mac.identity; p.build.mac.notarize=false; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
          elif [[ -n "$API_KEY" && -n "$API_KEY_ID" ]]; then
            mkdir -p ~/private_keys/
            printf '%s' "$API_KEY" > ~/private_keys/AuthKey_${API_KEY_ID}.p8
            brew install python-setuptools
          fi
      - name: Set environment variable USE_SYSTEM_FPM
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: echo "USE_SYSTEM_FPM=true" >> $GITHUB_ENV
      - name: Set environment variable USE_HARD_LINKS
        run: echo "USE_HARD_LINKS=false" >> $GITHUB_ENV
      - name: Modify package.json for dev branch
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-2022" ]]; then
            powershell -Command "(Get-Content package.json) -replace '\"productName\": \"Koodo Reader\"', '\"productName\": \"Koodo Reader DEV\"' | Set-Content package.json"
          else
            sed -i.bak 's/"productName": "Koodo Reader"/"productName": "Koodo Reader DEV"/' package.json
          fi
      - name: Modify package.json for Linux arm64 build
        if: startsWith(matrix.os, 'ubuntu-24.04-arm')
        run: |
          jq '.build.linux.target = [
            {
              "target": "deb",
              "arch": ["arm64"]
            },
            {
              "target": "AppImage", 
              "arch": ["arm64"]
            }
          ]' package.json > package.json.tmp && mv package.json.tmp package.json
      - name: Build/release Electron app
        uses: samuelmeuli/action-electron-builder@v1.6.0
        with:
          build_script_name: "build"
          # GitHub token, automatically provided to the action
          # (No need to define this secret in the repo settings)
          github_token: ${{ secrets.github_token }}

          # macOS code signing certificate
          mac_certs: ${{ secrets.MAC_CERTS }}
          mac_certs_password: ${{ secrets.MAC_CERTS_PASSWORD }}

          # If the commit is tagged with a version (e.g. "v1.0.0"),
          # release the app after building
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          # macOS notarization API key
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.API_KEY_ISSUER_ID }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koodo-reader-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.snap
            dist/*.yml
            dist/*.blockmap
